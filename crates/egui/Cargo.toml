[package]
name = "bn-client-egui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
bn-client-core = { path = "../core" }
clap = "=4.6.7"
eframe = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "file"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
egui_kittest = "=0.36.2"
serde_json = "=1.0.149"
