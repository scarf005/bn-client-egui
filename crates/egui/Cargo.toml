[package]
name = "bn-client-egui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
bn-client-core = { path = "../core" }
clap = "=4.6.7"
bytemuck = { version = "=1.25.2", features = ["derive"] }
eframe = "=0.36.2"
egui-wgpu = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "file"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
glam = "=0.34.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "vorbis", "wav"] }

profiling = { version = "1.0.18", default-features = false }
puffin = { version = "0.20", optional = true }

[features]
# Scope timings of every frame (egui's own scopes included) through puffin; see tests/it/perf_live.rs.
profile = ["dep:puffin", "profiling/profile-with-puffin"]
fake = ["bn-client-core/fake"]

[dev-dependencies]
bn-client-core = { path = "../core", features = ["fake"] }
cpu-time = "1"
egui_kittest = { version = "=0.36.2", features = ["wgpu"] }

[[example]]
name = "present_probe"
required-features = ["profile"]
