[package]
name = "bn-client-egui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
bn-client-core = { path = "../core" }
clap = "=4.6.7"
eframe = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "file"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

profiling = { version = "1.0.18", default-features = false }
puffin = { version = "0.20", optional = true }

[features]
# Scope timings of every frame (egui's own scopes included) through puffin; see tests/perf_live.rs.
profile = ["dep:puffin", "profiling/profile-with-puffin"]

[dev-dependencies]
cpu-time = "1"
egui_kittest = "=0.36.2"
