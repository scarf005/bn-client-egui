[package]
name = "bn-client-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
profiling = { version = "1.0.18", default-features = false }
clap = { version = "=4.6.7", features = ["derive", "env"] }
directories = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
which = "=8.0.6"

[features]
# The in-memory `FakeModel` for UI tests and `--fake`; it plays no game rules of the engine.
fake = []

[build-dependencies]
polib = "=0.3.0"
sha2 = "=0.10.9"

[dev-dependencies]
polib = "=0.3.0"
sha2 = "=0.10.9"
